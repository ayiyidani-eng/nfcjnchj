<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineVault</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#080B12;--card:#111723;--side:#0b101a;--tx:#e8eaf0;--mu:#8b93a7;--gold:#d4af6a;--red:#c8323c;--star:#d4af6a;--on:#14110a;--rad:16px;--fb:system-ui,-apple-system,'Segoe UI',sans-serif;--fh:Georgia,'Times New Roman',serif;--card2:color-mix(in srgb,var(--card) 88%,#fff);--line:color-mix(in srgb,var(--tx) 10%,transparent);--hv:color-mix(in srgb,var(--tx) 5%,transparent);--hv2:color-mix(in srgb,var(--tx) 9%,transparent);--st0:color-mix(in srgb,var(--tx) 22%,transparent)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--gold) 8%,transparent),transparent),radial-gradient(700px 400px at 0 100%,color-mix(in srgb,var(--red) 6%,transparent),transparent),var(--bg);color:var(--tx);font:15px var(--fb);min-height:100vh}
h1,h2,h3,.logo{font-family:var(--fh);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit;font-family:var(--fb)}
.side{position:fixed;inset:0 auto 0 0;width:230px;background:color-mix(in srgb,var(--side) 88%,transparent);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;transition:width .3s;z-index:20;overflow:hidden}
.logo{font-size:22px;letter-spacing:.5px;padding:0 10px 22px;white-space:nowrap;color:var(--gold)}.logo i{color:var(--red);font-style:normal}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--mu);background:none;border:0;cursor:pointer;white-space:nowrap;text-align:left;transition:.2s}
.nav span{font-size:18px;width:22px;text-align:center}.nav:hover{background:var(--hv);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent);color:var(--gold);box-shadow:inset 2px 0 var(--gold)}
.col{margin-top:auto}body.c .side{width:68px}body.c .nav b,body.c .logo small{display:none}body.c main{margin-left:68px}
main{margin-left:230px;padding:34px clamp(16px,3vw,44px) 60px;transition:margin .3s}
section{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:26px}
h1{font-size:clamp(26px,4vw,38px)}h2{font-size:21px;margin:34px 0 16px}.mu{color:var(--mu)}
.btn{background:var(--gold);color:var(--on);border:0;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.g{background:var(--hv2);color:var(--tx)}.btn.r{background:color-mix(in srgb,var(--red) 22%,transparent);color:color-mix(in srgb,var(--red) 65%,#fff)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:0 10px 30px #0006}
.kpi small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:1px}.kpi div{font-size:30px;font-family:var(--fh);margin-top:6px}.kpi div.s{font-size:18px;line-height:1.3}
.bar{height:8px;background:var(--hv2);border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:9px;transition:width .8s}
.feat{display:grid;grid-template-columns:170px 1fr;gap:26px;align-items:center;margin-top:18px;background:linear-gradient(110deg,color-mix(in srgb,var(--gold) 10%,transparent),transparent 60%),var(--card);cursor:pointer}
.feat h3{font-size:30px;margin:6px 0}
.poster{aspect-ratio:2/3;background:linear-gradient(160deg,hsl(var(--h) 40% 30%),hsl(calc(var(--h) + 40) 50% 9%));color:#fff;border-radius:calc(var(--rad)*.75);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:0 12px 28px #000a;width:100%}
.poster b{font-family:var(--fh);font-size:14px;line-height:1.2;z-index:0}.poster i{font-size:11px;color:#fffa;font-style:normal}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.strip{display:flex;gap:18px;overflow-x:auto;padding:6px 4px 18px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}.strip .m{flex:0 0 150px;scroll-snap-align:start}
.m{cursor:pointer;position:relative;transition:.3s}.m:hover{transform:translateY(-6px) scale(1.03)}.m:hover .poster{box-shadow:0 18px 40px #000,0 0 0 1px var(--gold),0 0 30px color-mix(in srgb,var(--gold) 19%,transparent)}
.m .t{margin-top:9px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m .s{font-size:12px;color:var(--mu)}
.heart{position:absolute;top:8px;right:8px;background:#000a;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;color:var(--red);font-size:14px;z-index:2}
.st{color:var(--st0);font-size:15px;letter-spacing:1px}.st.f{color:var(--star)}.stw{display:inline-flex;flex-direction:row;flex-wrap:nowrap;white-space:nowrap;vertical-align:middle}.st{display:inline-block}.st.hf{background:linear-gradient(90deg,var(--star) 50%,var(--st0) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .st{font-size:30px;cursor:pointer}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tools input,.tools select,.f input,.f select,.set input{background:var(--hv);border:1px solid var(--line);border-radius:10px;padding:10px 14px;outline:0}.tools input:focus,.f input:focus{border-color:var(--gold)}
.tools input[type=search]{flex:1;min-width:180px}option{background:var(--card)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:calc(100vh - 170px);min-height:460px}
.cal .h{text-align:center;color:var(--mu);font-size:12px;text-transform:uppercase;padding:6px}
.d{min-height:0;overflow:visible;border-radius:10px;background:var(--hv);border:1px solid var(--line);position:relative;padding:6px;font-size:12px;color:var(--mu)}
.d.e{background:none;border:0}.d.td{border-color:var(--gold)}
.d.has{cursor:pointer;padding:0}.d.has .poster{overflow:hidden}.d.has{border-radius:10px}.d.has .poster{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;padding:4px;box-shadow:none}.d.has .poster b{font-size:10px}
.d.has>em{position:absolute;top:3px;left:5px;color:#fff;font-style:normal;z-index:3;text-shadow:0 1px 3px #000;font-size:12px}
.tip{display:none;position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#000e;border:1px solid var(--gold);padding:8px 10px;border-radius:10px;width:160px;z-index:9;color:var(--tx);pointer-events:none}.d:hover .tip{display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cv{position:relative;height:240px}
.rk{display:flex;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.rk b{color:var(--gold);width:20px}.rk em{margin-left:auto;font-style:normal;color:var(--mu)}
.podium{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:20px;align-items:end;margin-bottom:24px}
.podium>div:first-child .poster{box-shadow:0 0 50px color-mix(in srgb,var(--gold) 28%,transparent)}.podium .n{position:absolute;top:-12px;left:-8px;z-index:3;background:var(--gold);color:var(--on);font:700 15px var(--fh);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.row{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;cursor:pointer}.row:hover{background:var(--hv)}.row .poster{width:44px;padding:0}.row .poster b,.row .poster i{display:none}
.row .a{margin-left:auto;display:flex;gap:8px}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:26px;display:grid;grid-template-columns:200px 1fr;gap:26px;animation:in .3s;position:relative}
.md .x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:24px;cursor:pointer;color:var(--mu)}
.chip{display:inline-block;padding:3px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;margin:3px 4px 3px 0;color:var(--gold)}
.f{display:grid;gap:10px;grid-column:1/-1}.f label{font-size:12px;color:var(--mu);display:grid;gap:4px}
.set{max-width:460px;display:grid;gap:14px}.set label{display:grid;gap:5px;color:var(--mu);font-size:13px}
.empty{color:var(--mu);padding:30px;text-align:center;grid-column:1/-1}
.bdg{position:absolute;bottom:6px;left:6px;z-index:3;background:var(--gold);color:var(--on);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}.d{display:flex;flex-direction:column;overflow:hidden;padding:4px 5px}.dn{font-size:12px;line-height:1}.ds{flex:1;min-height:0;display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;margin-top:4px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;padding-bottom:2px}.cp{height:100%;aspect-ratio:2/3;flex:0 0 auto;cursor:pointer}.cp .poster{height:100%;width:100%;aspect-ratio:auto;padding:4px;border-radius:6px;box-shadow:none}.cp .poster b{font-size:9px}.cp .poster i{display:none}.cp:hover .poster{outline:1px solid var(--gold)}#tp{position:fixed;display:none;background:#000e;border:1px solid var(--gold);padding:8px 10px;border-radius:10px;width:170px;z-index:95;pointer-events:none;font-size:12px}.poster.has b,.poster.has i{display:none}.lk{color:var(--gold);cursor:pointer;border-bottom:1px dotted #d4af6a80}.lk:hover{filter:brightness(1.3)}.lkr{cursor:pointer}.lkr:hover{color:var(--gold)}.selm .ck{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff9;background:#000a;z-index:3;display:grid;place-items:center;font-size:14px;color:var(--on)}.selm.on .ck{background:var(--gold);border-color:var(--gold)}.selm.on .poster{outline:3px solid var(--gold)}.selm:hover{transform:none}.rwr{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}.rwr .st{font-size:22px;cursor:pointer}.cp{position:relative}.rv{width:100%;min-height:64px;resize:vertical;background:var(--hv);border:1px solid var(--line);border-radius:10px;padding:10px;outline:0;margin-top:8px;color:var(--tx);font:inherit}.rwr .rv{flex:1 1 100%}#toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);background:#000e;border:1px solid var(--gold);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}.set input[type=file]{padding:8px}

/* ===== CINEVAULT DESIGN SYSTEM REFINEMENT ===== */
:root{--font-body:var(--fb);--font-display:var(--fh);--chart-grid:color-mix(in srgb,var(--tx) 12%,transparent);--surface:color-mix(in srgb,var(--card) 94%,var(--bg));--surface-raised:color-mix(in srgb,var(--card) 82%,var(--tx));--focus:color-mix(in srgb,var(--gold) 32%,transparent)}
html,body,button,input,select,textarea{font-family:var(--font-body)!important}
h1,h2,h3,h4,h5,h6,.logo,.kpi div,.feat h3,.cal .month-label{font-family:var(--font-display)!important}
button,input,select,textarea{color:var(--tx)}
input,select,textarea{background:var(--surface)!important;color:var(--tx)!important;border-color:var(--line)!important}
input::placeholder,textarea::placeholder{color:var(--mu)!important;opacity:.85}
option{background:var(--card)!important;color:var(--tx)!important}
.card,.md{background:var(--card);color:var(--tx);border-color:var(--line)}
.nav,.nav b,.nav span,.row,.m,.rk,.chip,.tools,.set,.f{font-family:var(--font-body)!important}
.btn,.nav,.chip,.bdg,.heart{transition:background-color .2s,color .2s,border-color .2s,transform .2s,filter .2s}
.btn.g{background:var(--hv2);color:var(--tx)}.btn.r{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.poster{border-radius:calc(var(--rad)*.72)}.m .poster{width:100%;aspect-ratio:2/3;}
.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:22px;align-items:start}
.grid .m{min-width:0}.m .t{line-height:1.35;min-height:1.35em}.m .s{line-height:1.45}
/* Uniform favourites: one grid, one poster ratio, no podium scaling */
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:22px;align-items:start}
.fav-grid .fav-item{min-width:0;position:relative}.fav-grid .poster{width:100%;aspect-ratio:2/3!important;height:auto!important;}
.fav-grid .m{transform:none!important}.fav-grid .m:hover{transform:translateY(-4px)!important}
.fav-grid .rank{position:absolute;z-index:4;top:9px;left:9px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on);font-weight:700;font-size:12px;box-shadow:0 3px 12px #0008}
.fav-grid .fav-controls{display:flex;gap:6px;justify-content:center;margin-top:8px}
.fav-grid .fav-controls .btn{padding:5px 11px}
/* Search catalogue */
.search-shell{display:grid;gap:18px}.search-panel{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad)}
.search-panel h3{font:600 15px var(--fb)!important;margin-bottom:12px;color:var(--tx)}
.search-main{display:flex;gap:10px;flex-wrap:wrap}.search-main input{flex:1;min-width:220px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.filter-grid label{display:grid;gap:6px;color:var(--mu);font-size:12px}.filter-grid input,.filter-grid select{width:100%;min-width:0}
.genre-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.genre-chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--hv);color:var(--mu);cursor:pointer;font-size:12px}.genre-chip.active{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:var(--gold);color:var(--gold)}
.active-filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.active-filter{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-size:12px}.active-filter button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px}
.search-results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.search-result-card{min-width:0}.search-result-card .poster{aspect-ratio:2/3}.search-result-card .meta{font-size:12px;color:var(--mu);margin-top:4px;line-height:1.5}
.search-pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0}
/* Appearance controls and saved presets */
.design-manager{max-width:760px;margin-top:16px}.design-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}.design-entry{display:flex;align-items:center;gap:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--hv)}.design-entry strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.design-entry button{padding:6px 9px}
.design-swatches{display:flex;gap:3px}.design-swatches i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid #ffffff30}
/* Chart customization */
.chart-customizer{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:var(--rad);background:var(--card)}
.chart-colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:12px}
.chart-color{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--hv);border-radius:9px;font-size:12px;color:var(--tx)}
.chart-color input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
/* CineVault refinements v2 */
.search-shell,.search-shell *{font-family:var(--fb)!important}
.search-panel{background:linear-gradient(145deg,color-mix(in srgb,var(--card) 94%,var(--gold) 6%),var(--card));border:1px solid color-mix(in srgb,var(--gold) 18%,var(--line));box-shadow:0 12px 32px #0003}
.search-panel:first-child{padding:22px}
.search-main input,.filter-grid input,.filter-grid select{font-family:var(--fb)!important;background:color-mix(in srgb,var(--bg) 72%,var(--card));border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:12px;padding:12px 14px;color:var(--tx);min-height:44px;transition:border-color .2s,box-shadow .2s}
.search-main input:focus,.filter-grid input:focus,.filter-grid select:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 16%,transparent)}
.filter-grid label{font-family:var(--fb)!important;font-weight:600;letter-spacing:.01em}
.genre-chip{font-family:var(--fb)!important;padding:8px 14px;background:color-mix(in srgb,var(--bg) 55%,var(--card));border-color:color-mix(in srgb,var(--tx) 13%,transparent);transition:.2s}
.genre-chip:hover{border-color:var(--gold);color:var(--tx);transform:translateY(-1px)}
.genre-chip.active{background:color-mix(in srgb,var(--gold) 17%,var(--card));box-shadow:inset 0 0 0 1px var(--gold)}
.search-panel .btn{font-family:var(--fb)!important;border-radius:12px}
.fav-best-grid{margin-bottom:8px}
.fav-best-grid .fav-item{min-width:0}
.watch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;align-items:start}
.watch-item{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--hv);transition:transform .2s,border-color .2s}
.watch-item:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.watch-poster{cursor:pointer}.watch-poster .poster{width:100%;aspect-ratio:2/3!important;height:auto!important;border-radius:calc(var(--rad)*.75);box-shadow:none;padding:8px}
.watch-info{padding:10px;display:grid;gap:5px;min-width:0}
.watch-info>b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-info>span,.watch-info>small{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-actions{display:flex;gap:6px;margin-top:5px}.watch-actions .btn{flex:1;padding:7px 5px;font-size:11px}
.chart-customizer{max-width:900px}
.chart-customizer .chart-color{font-family:var(--fb)!important}
@media(max-width:820px){.watch-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}}
@media(max-width:520px){.watch-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.watch-info{padding:8px}.watch-actions .btn{font-size:10px}}

@media(max-width:760px){.grid,.fav-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}.search-panel{padding:14px}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media(max-width:760px){.cal{height:calc(100vh - 250px);gap:4px}
.side{inset:auto 0 0 0;width:100%!important;height:62px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);overflow-x:auto}.logo,.col{display:none}.nav{flex-direction:column;gap:2px;padding:6px 10px;font-size:10px}.nav b{display:block!important}
main,body.c main{margin:0;padding:20px 14px 90px}.feat{grid-template-columns:110px 1fr;gap:14px}.feat h3{font-size:21px}.md{grid-template-columns:1fr}.md .poster{max-width:150px}.podium{grid-template-columns:1fr 1fr}.podium>div:first-child{grid-column:1/-1;max-width:200px}.d{padding:3px;font-size:10px}}

/* Community profile groundwork */
.community-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:20px 0}
.community-user{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;transition:transform .2s,border-color .2s}
.community-user:hover{transform:translateY(-3px);border-color:var(--gold)}
.community-avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--red));color:#fff;font:700 24px var(--fh)}
.community-avatar.large{width:76px;height:76px;flex-basis:76px;font-size:30px}
.community-user-info{min-width:0;flex:1}.community-user-info h2{margin:0;font-size:17px}.community-user-info p{margin:4px 0 8px;font-size:12px}
.community-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu)}.community-stats b{color:var(--tx)}
.community-empty{padding:44px 24px;text-align:center;margin-top:18px}

].map((a,i)=>({id:i+1,title:a[0],year:a[1],dur:a[2],dir:a[3],genres:a[4],cast:a[5],date:a[6],rating:a[7],fav:!!a[8],seen:!!a[6],poster:''}));

const seen=()=>S.movies.filter(m=>m.seen),yr=()=>views().filter(m=>m.date&&m.date.startsWith(Y)),byDate=a=>[...a].sort((x,y)=>(y.date||'').localeCompare(x.date||''));
const avg=a=>a.filter(m=>m.rating>0).length?(a.filter(m=>m.rating>0).reduce((s,m)=>s+m.rating,0)/a.filter(m=>m.rating>0).length):0;

function P(m){const h=Math.abs([...m.title].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;return `<div class="poster${m.poster?' has':''}" style="--h:${h}">${m.poster?`<img src="${esc(m.poster)}" alt="" onerror="this.parentNode.classList.remove('has');this.remove()">`:''}<b>${esc(m.title)}</b><i>${m.year}</i></div>`}

function cmInner(m){return `<div class="cc-lbl">Calificación</div><div class="cc-stars" onclick="cmRate(${m.id},event${m._rw?','+(m._rw-1):''})">${stars(m.rating)}</div><button class="cc-item" onclick="cmAgain(${m.id},event)">↻ Agregar otra vez a la watchlist</button>${m._rw?'':`<button class="cc-item" onclick="cmRw0(${m.id},event)">↻ ${m.rw0?'Quitar «rewatch» del primer visionado':'Primer visionado como rewatch'}</button>`}<button class="cc-item" onclick="cmFav(${m.id},event)"><span class="h">${m.fav?'♥':'♡'}</span> ${m.fav?'Quitar de favoritos':'Añadir a favoritos'}</button>`}
function collCard(m,nomenu){return `<div class="m" onclick="openM(${m.id})">${m.fav?'<div class="heart">♥</div>':''}${P(m)}<div class="cc-t">${esc(m.title)}</div><div class="cs">${m.seen&&m.rating>0?stars(m.rating):''}</div>${nomenu?'':`<button class="cc-dots" title="Opciones" onclick="cmToggle(event,${m.id})">⋯</button><div class="cc-menu" onclick="event.stopPropagation()">${cmInner(m)}</div>`}</div>`}
function closeCM(){document.querySelectorAll('.cc-menu.on').forEach(x=>{x.classList.remove('on');x.style.right='';x.closest('.m')?.classList.remove('cm-open')})}
function cmToggle(e,id){e.stopPropagation();const b=e.currentTarget,mn=b.nextElementSibling,open=mn.classList.contains('on');closeCM();if(open)return;mn.classList.add('on');b.closest('.m').classList.add('cm-open');const r=mn.getBoundingClientRect();if(r.left<8)mn.style.right=(parseFloat(getComputedStyle(mn).right)-(8-r.left))+'px'}
document.addEventListener('click',()=>{closeCM();if(STD){STD=false;render()}});
let STD=false;
function cmRate(id,e,ri){e.stopPropagation();const t=e.target.closest('.st');if(!t)return;const i=+t.dataset.i,half=e.clientX-t.getBoundingClientRect().left<t.offsetWidth/2,v=half?i-.5:i,m=get(id),o=ri==null?m:m.rw[ri],box=t.closest('.cc-stars'),card=t.closest('.m');o.rating=o.rating==v?0:v;save();box.innerHTML=stars(o.rating);const sr=card.querySelector(':scope>.cs');if(sr)sr.innerHTML=o.rating>0?stars(o.rating):'';if(view=='stats')STD=true}
function statCard(m){return `<div class="m" onclick="openM(${m.id})">${m.fav?'<div class="heart">♥</div>':''}${P(m)}<div class="cc-t">${esc(m.title)}${isRw(m)?' ↻':''}</div><div class="cs">${m.rating>0?stars(m.rating):''}</div>${VW?'':`<button class="cc-dots" title="Opciones" onclick="cmToggle(event,${m.id})">⋯</button><div class="cc-menu" onclick="event.stopPropagation()">${cmInner(m)}</div>`}</div>`}
function cmRw0(id,e){e.stopPropagation();const m=get(id);m.rw0=!m.rw0;save();closeCM();render();toast(m.rw0?'Primer visionado marcado como rewatch':'El primer visionado vuelve a contar como primera vez')}
function cmFav(id,e){e.stopPropagation();const m=get(id),card=e.currentTarget.closest('.m');m.fav=!m.fav;if(m.fav){S.favOrder=(S.favOrder||[]).filter(x=>x!=id);S.favOrder.push(id)}save();card.querySelector(':scope>.heart')?.remove();if(m.fav)card.insertAdjacentHTML('afterbegin','<div class="heart">♥</div>');e.currentTarget.innerHTML=`<span class="h">${m.fav?'♥':'♡'}</span> ${m.fav?'Quitar de favoritos':'Añadir a favoritos'}`;toast(m.fav?'Añadida a favoritos':'Quitada de favoritos')}
function cmAgain(id,e){e.stopPropagation();const m=get(id);closeCM();if(S.movies.some(x=>!x.seen&&x.title==m.title&&x.year==m.year))return toast('Ya está en tu watchlist');S.movies.push({...m,id:++nid,seen:false,date:null,rating:0,fav:false,review:'',rw:[],genres:[...m.genres],cast:[...m.cast]});save();toast('Añadida otra vez a la watchlist')}
const MQ=window.matchMedia('(max-width:760px)'),MOB=()=>MQ.matches,MAIN=['home','search','coll','cal','community'];let moreOpen=false;
if(MQ.addEventListener)MQ.addEventListener('change',()=>{if(typeof USER!=='undefined'&&USER)render()});
function side(){
if(!MOB()){moreOpen=false;$('#mtop').innerHTML='';$('#more').innerHTML='';
$('#side').innerHTML=`<div class="logo">Cine<i>Vault</i></div>`+NAV.map(n=>`<button class="nav ${view==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span><b>${n[2]}</b></button>`).join('')+`<button class="nav out" onclick="logout()"><span>⏻</span><b>Cerrar sesión</b></button><button class="nav col" onclick="document.body.classList.toggle('c')"><span>⇔</span><b>Contraer</b></button>`;return}

$('#side').innerHTML=MAIN.map(k=>`<button class="nav ${view==k?'on':''}" onclick="go('${k}')"><span>${ico[k][1]}</span><b>${ico[k][2]}</b></button>`).join('')+`<button class="nav ${!MAIN.includes(view)||moreOpen?'on':''}" onclick="moreOpen=!moreOpen;side()"><span>☰</span><b>Más</b></button>`;
$('#more').innerHTML=moreOpen?`<div class="more-bg" onclick="moreOpen=false;side()"></div><div class="more-sheet">${NAV.filter(n=>!MAIN.includes(n[0])).map(n=>`<button class="${view==n[0]?'on':''}" onclick="moreOpen=false;go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}<button class="out" onclick="moreOpen=false;logout()"><span>⏻</span>Cerrar sesión</button></div>`:'';
$('#mtop').innerHTML=`<div class="logo">Cine<i>Vault</i></div><button class="mavatar" onclick="go('set')">${esc(((typeof USER!=='undefined'&&USER&&USER.username)||'?').slice(0,1).toUpperCase())}</button>`}
function go(v){if(VW){S=ME;ME=null;VW=null}LS.cur=null;GR.open=false;communityProfile=false;moreOpen=false;SEL.on=false;SEL.ids.clear();view=v;render();scrollTo(0,0)}
function render(){document.body.dataset.view=(view==='community'&&communityProfile&&VW)?communityTab:view;side();charts.forEach(c=>c.destroy());charts=[];const V={home,search,coll,diary,cal,stats,favs,watch,community,set,lists,ach}[view];$('#app').innerHTML=`<section>${V()}</section>`;if(view=='stats'||(view==='community'&&communityProfile&&communityTab==='stats'))drawCharts();if(view=='coll')gridC();if(view=='watch'||(view==='community'&&communityProfile&&communityTab==='watch'))listW();try{achCheck()}catch(e){}}
/* ===== INICIO ===== */
function home(){const y=yr(),h=y.reduce((s,m)=>s+m.dur,0),best=[...y].sort((a,b)=>b.rating-a.rating)[0],last=byDate(seen())[0],pc=Math.min(100,y.length/S.goal*100);
return `<div class="top"><div><p class="mu">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><h1>Bienvenido, ${esc(S.name)}</h1></div><div class="tools" style="margin:0"><button class="btn g" onclick="qp()" title="Ctrl + K">⌕ Búsqueda rápida</button><button class="btn g" onclick="pickTonight()">🎲 ¿Qué veo hoy?</button><button class="btn" onclick="addM()">+ Registrar película</button></div></div>
<div class="kpis"><div class="card kpi"><small>Vistas en ${Y}</small><div>${y.length}</div></div><div class="card kpi"><small>Horas de cine</small><div>${(h/60).toFixed(1)}h</div></div><div class="card kpi"><small>Puntuación media</small><div>${avg(y).toFixed(2)} ★</div></div><div class="card kpi"><small>Favorita del año</small><div class="s">${best?esc(best.title):'—'}</div></div><div class="card kpi"><small>Objetivo ${y.length}/${S.goal}</small><div>${Math.round(pc)}%</div><div class="bar"><i style="width:${pc}%"></i></div></div>${pace(y)}</div>
${last?`<div class="card feat" onclick="openM(${last.id})"><div>${P(last)}</div><div><small class="mu">ÚLTIMA PELÍCULA VISTA</small><h3>${esc(last.title)}</h3><p class="mu">Dirigida por ${esc(last.dir)} · ${last.year} · ${last.dur} min</p><p style="margin:10px 0" class="mu">Visto el ${fmtD(last.date)}</p><div class="big">${stars(last.rating)}</div></div></div>`:''}
${otd()}<h2>Últimas películas</h2><div class="stripw"><button class="sa l" onclick="stripGo(-1)">‹</button><div class="strip" id="hs">${byDate(seen()).slice(0,12).map(m=>card(m)).join('')||'<p class="empty">Aún no hay películas.</p>'}</div><button class="sa r" onclick="stripGo(1)">›</button></div>`}
function pace(y){const day=Math.floor((new Date()-new Date(Y,0,0))/864e5),exp=Math.round(S.goal*day/365),d=y.length-exp,ly=views().filter(m=>m.date&&m.date.startsWith(String(Y-1))&&m.date.slice(5)<=TODAY.slice(5)).length;
return `<div class="card kpi"><small>Ritmo anual</small><div class="s">${d>=0?'+'+d+' por delante':(-d)+' por detrás'}</div><small style="text-transform:none;letter-spacing:0">Esperado: ${exp} · ${Y-1} a esta fecha: ${ly}</small></div>`}
function otd(){const md=TODAY.slice(5),a=views().filter(m=>m.date&&m.date.slice(5)==md&&m.date.slice(0,4)!=String(Y)).sort((x,y)=>y.date.localeCompare(x.date));if(!a.length)return '';
return `<h2>Un día como hoy</h2><div class="strip">${a.map(m=>{const n=Y-+m.date.slice(0,4);return `<div class="m" onclick="openM(${m.id})">${P(m)}<div class="cc-t">${esc(m.title)}</div><div class="cs"><span class="cm">Hace ${n} año${n==1?'':'s'}${m.rating>0?' · '+m.rating+' ★':''}</span></div></div>`}).join('')}</div>`}
function stripGo(d){const s=document.getElementById('hs');if(s)s.scrollBy({left:d*s.clientWidth*.8,behavior:'smooth'})}
/* ===== COLECCIÓN ===== */
function coll(){const f=F.c;return `<div class="top"><h1>Mi colección</h1><div class="tools" style="margin:0"><button class="btn g" onclick="selTog()">${SEL.on?'✕ Salir de selección':'☑ Seleccionar'}</button><button class="btn" onclick="addM()">+ Añadir</button></div></div><div id="selbar"></div><div class="tools"><input type="search" placeholder="Buscar título, director…" value="${esc(f.q)}" oninput="F.c.q=this.value;gridC()"><select onchange="F.c.g=this.value;gridC()"><option value="">Todos los géneros</option>${genres().map(g=>`<option ${f.g==g?'selected':''}>${g}</option>`).join('')}</select><select onchange="F.c.s=this.value;gridC()"><option value="date">Más recientes</option><option value="rating" ${f.s=='rating'?'selected':''}>Mejor valoradas</option><option value="title" ${f.s=='title'?'selected':''}>A–Z</option><option value="year" ${f.s=='year'?'selected':''}>Año</option><option value="dur" ${f.s=='dur'?'selected':''}>Más largas</option></select><select onchange="F.c.r=this.value;gridC()"><option value="">Cualquier nota</option>${[5,4.5,4,3.5,3].map(n=>`<option value="${n}" ${f.r==n?'selected':''}>${n}+ ★</option>`).join('')}</select><select onchange="F.c.d=this.value;gridC()"><option value="">Todas las décadas</option>${[...new Set(seen().map(m=>m.year?Math.floor(m.year/10)*10:0).filter(Boolean))].sort((a,b)=>b-a).map(d=>`<option value="${d}" ${f.d==d?'selected':''}>${d}s</option>`).join('')}</select><select onchange="F.c.v=this.value;gridC()"><option value="">Todas</option><option value="1" ${f.v?'selected':''}>Solo favoritas</option></select>${(()=>{const t=[...new Set(S.movies.flatMap(m=>m.tags||[]))].sort();return t.length?`<select onchange="F.c.t=this.value;gridC()"><option value="">Todas las etiquetas</option>${t.map(x=>`<option ${f.t==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''})()}</div><div class="grid" id="g"></div>`}
function gridC(){const f=F.c,q=f.q.toLowerCase();let a=seen().filter(m=>(!f.g||m.genres.includes(f.g))&&(m.title+m.dir+m.cast.join()).toLowerCase().includes(q)&&(!f.r||m.rating>=+f.r)&&(!f.d||Math.floor((m.year||0)/10)*10==+f.d)&&(!f.v||m.fav)&&(!f.t||(m.tags||[]).includes(f.t)));
a=f.s=='rating'?a.sort((x,y)=>y.rating-x.rating):f.s=='title'?a.sort((x,y)=>x.title.localeCompare(y.title)):f.s=='year'?a.sort((x,y)=>y.year-x.year):f.s=='dur'?a.sort((x,y)=>y.dur-x.dur):byDate(a);VIS=a;$('#g').innerHTML=a.map(m=>SEL.on?selCard(m):collCard(m)).join('')||'<p class="empty">Sin resultados.</p>';$('#selbar').innerHTML=selBar()}

function diary(){const a=byDate(views());return `<div class="top"><h1>Diario cinematográfico</h1>${VW?'':'<button class="btn" onclick="addM()">+ Registrar</button>'}</div><div class="diary-list">${a.map(m=>`<div class="row card" onclick="openM(${m.id})"><span class="mu dd" style="width:100px">${fmtD(m.date)}</span>${P(m)}<div><b>${esc(m.title)}</b> <span class="mu">${m.year}</span>${isRw(m)?' <span class="chip">↻ Rewatch</span>':''}<br><small class="mu">${esc(m.dir)}</small>${m.review?`<br><small style="opacity:.85">“${esc(m.review.slice(0,140))}${m.review.length>140?'…':''}”</small>`:''}</div><div class="a">${m.fav?'<span style="color:var(--red)">♥</span>':''}${stars(m.rating)}</div></div>`).join('')||'<p class="empty">Diario vacío.</p>'}</div>`}
/* ===== CALENDARIO ===== */
function cal(){const mob=MOB(),first=(new Date(calY,calM,1).getDay()+6)%7,days=new Date(calY,calM+1,0).getDate();let c=['L','M','X','J','V','S','D'].map(d=>`<div class="h">${d}</div>`).join('')+'<div class="d e"></div>'.repeat(first);
for(let d=1;d<=days;d++){const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ms=views().filter(m=>m.date==ds);
if(mob){c+=`<div class="d ${ds==TODAY?'td':''} ${ms.length?'hasm':''}" ${ms.length?`onclick="dayM('${ds}')"`:''}><span class="dn">${d}</span>${ms.length?`<div class="mp">${P(ms[0])}${ms.length>1?`<span class="bdg">+${ms.length-1}</span>`:''}</div>`:''}</div>`;continue}
c+=`<div class="d ${ds==TODAY?'td':''}"><span class="dn">${d}</span>${ms.length?`<div class="ds">${ms.map(x=>`<div class="cp" onclick="openM(${x.id})" onmouseenter="tip(event,${x.id},${x._rw||0})" onmouseleave="tip()">${isRw(x)?'<span class="bdg" style="bottom:auto;top:3px;left:3px;padding:0 6px">↻</span>':''}${P(x)}</div>`).join('')}</div>`:''}</div>`}
const mk=`${calY}-${String(calM+1).padStart(2,'0')}`,list=mob?byDate(views().filter(m=>m.date&&m.date.startsWith(mk))):[];

async function pTM(id){const q=$('#pq').value.trim(),el=$('#pr'),m=get(id);if(!q)return;el.innerHTML='<p class="mu">Buscando película y recopilando sus portadas…</p>';try{let hits=(await tm('/search/movie',{query:q,...(m.year?{year:m.year}:{})})).results||[];if(!hits.length)hits=(await tm('/search/movie',{query:q})).results||[];const hit=hits.find(x=>x.title.toLowerCase()===(m.title||'').toLowerCase())||hits[0];if(!hit)throw new Error('No se encontró la película en TMDB.');const data=await tm('/movie/'+hit.id+'/images',{include_image_language:'es,en,null',language:''});let posters=(data.posters||[]).filter(x=>x.file_path);posters.sort((a,b)=>{const rank=x=>(x.iso_639_1==='es'?3:x.iso_639_1==='en'?2:x.iso_639_1===null?1:0);return rank(b)-rank(a)||(b.vote_average||0)-(a.vote_average||0)});if(!posters.length&&hit.poster_path)posters=[{file_path:hit.poster_path,iso_639_1:null,vote_average:0}];el.innerHTML=`<p class="mu" style="font-size:11px">${posters.length} portadas encontradas para <b>${esc(hit.title)}</b> (${(hit.release_date||'').slice(0,4)}). Toca una para aplicarla.</p><div class="strip" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px">${posters.map((x,i)=>`<button type="button" class="m" title="Elegir portada ${i+1}" style="min-width:0;padding:3px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer" onclick="setP(${id},'https://image.tmdb.org/t/p/w500${x.file_path}','tmdb-alt')"><img loading="lazy" src="https://image.tmdb.org/t/p/w185${x.file_path}" style="width:100%;display:block;border-radius:6px"><span class="s">${x.iso_639_1==='es'?'ES':x.iso_639_1==='en'?'EN':x.iso_639_1||'Sin texto'} · ${Number(x.vote_average||0).toFixed(1)}★</span></button>`).join('')}</div>`}catch(e){el.innerHTML=`<p style="color:var(--err)">${esc(e.message)}</p>`}}

function search(){return `<div class="top"><div><p class="mu">Explora el catálogo mundial</p><h1>Descubrir películas</h1></div><button class="btn" onclick="dkStart()">♥ Quiero añadir a la watchlist hoy</button></div><div class="search-shell"><div class="search-panel"><div class="search-main"><input type="search" id="sq" placeholder="Buscar título, actor o director…" value="${esc(SF.q||SQ.q)}" oninput="SF.q=this.value" onkeydown="if(event.key==='Enter')srch()"><button class="btn" onclick="srch()">Buscar</button><button class="btn g" onclick="clearSearch()">Limpiar</button></div><p class="mu" style="font-size:12px;margin-top:9px">Busca por texto o combina los filtros para descubrir películas por época, género y duración.</p></div><div class="search-panel"><div class="search-results-head"><h3>Filtros avanzados</h3><span class="mu" style="font-size:12px">Puedes combinar varios filtros</span></div><h3 style="margin-top:12px">Géneros</h3><div class="genre-chips">${SEARCH_GENRES.map(([g,id])=>`<button class="genre-chip ${SF.genres.includes(id)?'active':''}" onclick="toggleSearchGenre(${id})">${g}</button>`).join('')}</div><div class="filter-grid"><label>Década<select id="sfDecade" onchange="SF.decade=this.value;updateFilterChips()"><option value="">Todas las décadas</option>${Array.from({length:11},(_,i)=>1920+i*10).map(d=>`<option value="${d}" ${SF.decade==d?'selected':''}>${d}s</option>`).join('')}</select></label><label>Año desde<input id="sfFrom" type="number" min="1870" max="${Y+10}" placeholder="Ej. 1990" value="${esc(SF.from)}" onchange="SF.from=this.value;updateFilterChips()"></label><label>Año hasta<input id="sfTo" type="number" min="1870" max="${Y+10}" placeholder="Ej. 2024" value="${esc(SF.to)}" onchange="SF.to=this.value;updateFilterChips()"></label><label>Duración<select id="sfRuntime" onchange="SF.runtime=this.value;updateFilterChips()"><option value="">Cualquier duración</option><option value="0-89" ${SF.runtime=='0-89'?'selected':''}>Menos de 90 min</option><option value="90-120" ${SF.runtime=='90-120'?'selected':''}>90–120 min</option><option value="120-150" ${SF.runtime=='120-150'?'selected':''}>120–150 min</option><option value="150-999" ${SF.runtime=='150-999'?'selected':''}>Más de 150 min</option></select></label><label>Valoración mínima TMDB<select id="sfRating" onchange="SF.rating=this.value;updateFilterChips()"><option value="">Cualquiera</option>${[5,6,7,8,9].map(n=>`<option value="${n}" ${SF.rating==n?'selected':''}>${n}+ / 10</option>`).join('')}</select></label><label>Ordenar por<select id="sfSort" onchange="SF.sort=this.value;updateFilterChips()"><option value="popularity.desc" ${SF.sort=='popularity.desc'?'selected':''}>Popularidad</option><option value="vote_average.desc" ${SF.sort=='vote_average.desc'?'selected':''}>Mejor valoradas</option><option value="primary_release_date.desc" ${SF.sort=='primary_release_date.desc'?'selected':''}>Más recientes</option><option value="primary_release_date.asc" ${SF.sort=='primary_release_date.asc'?'selected':''}>Más antiguas</option><option value="vote_count.desc" ${SF.sort=='vote_count.desc'?'selected':''}>Más votadas</option></select></label><label>Idioma original<input id="sfLang" maxlength="2" placeholder="Ej. en, es, ko" value="${esc(SF.language)}" onchange="SF.language=this.value.trim().toLowerCase();updateFilterChips()"></label><label>País de producción<input id="sfCountry" maxlength="2" placeholder="Ej. US, ES, KR" value="${esc(SF.country)}" onchange="SF.country=this.value.trim().toUpperCase();updateFilterChips()"></label><label>Actor o director<input id="sfPerson" placeholder="Nombre de persona" value="${esc(SF.person)}" onchange="SF.person=this.value.trim();updateFilterChips()"></label></div><div class="tools" style="margin:16px 0 0"><button class="btn" onclick="runDiscover(1)">Aplicar filtros</button><button class="btn g" onclick="dkStart()">♥ Sugerirme para la watchlist</button><button class="btn g" onclick="clearSearchFilters()">Restablecer filtros</button></div></div><div class="active-filters" id="activeFilters"></div><div class="search-results-head"><h2 style="margin:0">Resultados</h2><span id="searchCount" class="mu" style="font-size:12px">${DISC.items.length?DISC.items.length+' resultados':''}</span></div><div id="sr">${tk()?(SQ.h||'<p class="empty">Busca una película o aplica filtros para comenzar.</p>'):'<p class="empty">Configura tu API key de TMDB en Configuración para buscar.</p>'}</div><div id="searchPages"></div></div>`}
function toggleSearchGenre(id){SF.genres=SF.genres.includes(id)?SF.genres.filter(x=>x!==id):[...SF.genres,id];renderSearchControls();}

function removeSearchFilter(k){if(k.startsWith('genre:'))SF.genres=SF.genres.filter(x=>x!=+k.split(':')[1]);else if(k==='q')SF.q='';else SF[k==='years'?'from':k]='';if(k==='years')SF.to='';if(k==='decade')SF.decade='';if(k==='runtime')SF.runtime='';if(k==='rating')SF.rating='';if(k==='language')SF.language='';if(k==='country')SF.country='';if(k==='person')SF.person='';render();}

function buildDiscoverParams(page,f=SF){const p={page,sort_by:f.sort||'popularity.desc',include_adult:false};let from=f.from?+f.from:null,to=f.to?+f.to:null;if(f.decade){from=Math.max(from||0,+f.decade);to=Math.min(to||9999,+f.decade+9)}if(from)p['primary_release_date.gte']=from+'-01-01';if(to)p['primary_release_date.lte']=to+'-12-31';if(f.genres.length)p.with_genres=f.genres.join(',');if(f.rating)p['vote_average.gte']=f.rating;if(f.language)p.with_original_language=f.language;if(f.country)p.with_origin_country=f.country;if(f.runtime){const [a,b]=f.runtime.split('-');if(+a>0)p['with_runtime.gte']=a;if(+b<999)p['with_runtime.lte']=b}return p}
async function searchTextWithFilters(page=1){const el=$('#sr');if(el)el.innerHTML='<p class="mu">Buscando y aplicando filtros…</p>';try{const r=await tm('/search/movie',{query:SF.q,page,include_adult:false});let items=r.results||[];const min=SF.decade?Math.max(+SF.decade,+SF.from||0):(+SF.from||0),max=SF.decade?Math.min(+SF.decade+9,+SF.to||9999):(+SF.to||9999);items=items.filter(x=>{const y=+(x.release_date||'').slice(0,4),g=x.genre_ids||[];return (!min||y>=min)&&(!max||y<=max)&&(!SF.genres.length||SF.genres.every(id=>g.includes(id)))&&(!SF.rating||x.vote_average>=+SF.rating)});if(SF.person){const pp=(await tm('/search/person',{query:SF.person})).results||[];if(pp.length){const cr=await tm('/discover/movie',{...buildDiscoverParams(page),with_people:pp[0].id});const ids=new Set((cr.results||[]).map(x=>x.id));items=items.filter(x=>ids.has(x.id))}else items=[]}if(SF.runtime){const [a,b]=SF.runtime.split('-');const details=await Promise.all(items.map(x=>tm('/movie/'+x.id).catch(()=>null)));items=items.filter((x,i)=>details[i]&&details[i].runtime>=+a&&details[i].runtime<=+b)}DISC={page:r.page,total:r.total_pages,items,active:true};renderDiscoverResults()}catch(e){if(el)el.innerHTML=`<p class="mu">${esc(e.message)}</p>`}}

const tk=()=>((ME||S).tmdb||'').replace(/^Bearer\s+|["'\s]/g,'');
async function tm(path,q={}){const k=tk();if(!k)throw new Error('Añade tu API key de TMDB en Configuración');const u=new URL('https://api.themoviedb.org/3'+path);Object.entries({language:'es-ES',...q}).forEach(([a,b])=>u.searchParams.set(a,b));const o={};if(k.startsWith('eyJ'))o.headers={Authorization:'Bearer '+k};else u.searchParams.set('api_key',k);let r;try{r=await fetch(u,o)}catch(e){throw new Error('No se pudo conectar con TMDB: tu navegador, red, extensión o la vista previa lo bloquea. Descarga index.html y ábrelo directamente en el navegador.')}if(!r.ok)throw new Error(r.status==401?'Clave rechazada por TMDB (401). Usa la «API Key» v3 (32 caracteres) o el «Token de acceso de lectura» (empieza por eyJ), sin comillas.':'Error TMDB '+r.status);return r.json()}
const fromTM=d=>({title:d.title,year:+(d.release_date||'').slice(0,4)||'',dur:d.runtime||0,dir:(d.credits?.crew||[]).filter(c=>c.job=='Director').map(c=>c.name).join(', '),genres:(d.genres||[]).map(g=>g.name),cast:(d.credits?.cast||[]).slice(0,15).map(c=>c.name),poster:d.poster_path?'https://image.tmdb.org/t/p/w500'+d.poster_path:'',desc:d.overview||''});

async function enrich(id,silent){const m=get(id),d=await tmFind(m.title,m.year);m.tm=1;save();if(!d){if(!silent)toast('No encontrada en TMDB');return false}if(!m.poster)m.poster=d.poster;if(!m.dur)m.dur=d.dur;if(!m.dir)m.dir=d.dir;if(!m.genres.length)m.genres=d.genres;if(d.cast.length>m.cast.length)m.cast=d.cast;if(!m.desc)m.desc=d.desc;save();return true}

function parseCSV(t){const R=[];let r=[],c='',q=0;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==',')(r.push(c),c='');else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x))R.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x))R.push(r);const h=(R.shift()||[]).map(x=>x.trim());return{h,rows:R.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"',toCSV=(h,rows)=>[h.map(csvq).join(','),...rows.map(r=>r.map(csvq).join(','))].join('\r\n');
let nid=Date.now();
async function imp(files){const log=[];for(const f of files){const{h,rows}=parseCSV(await f.text()),n=f.name.toLowerCase(),has=k=>h.includes(k),kind=has('Watched Date')?'diary':n.includes('watchlist')?'watchlist':n.includes('like')?'likes':has('Rating')?'ratings':'watched';let k=0;
rows.forEach(r=>{const t=r.Name||r.Title;if(!t)return;const y=+r.Year||'';let m=S.movies.find(x=>x.title.toLowerCase()==t.toLowerCase()&&(!y||!x.year||x.year==y));if(!m){m={id:++nid,title:t,year:y||Y,dur:0,dir:'',genres:[],cast:[],poster:'',seen:false,date:null,rating:0,fav:false};S.movies.push(m)}k++;
if(kind!='watchlist'){m.seen=true;const d=(kind=='diary'?r['Watched Date']||r.Date:r.Date)||'';const rt=Math.min(5,Math.max(0,+r.Rating||0));if(kind=='diary'&&r.Rewatch=='Yes'&&m.date&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d!=m.date&&!(m.rw||[]).some(x=>x.date==d)){(m.rw=m.rw||[]).push({date:d,rating:rt});return}if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&(!m.date||kind=='diary'&&d>m.date))m.date=d;if(rt)m.rating=rt;if(kind=='likes')m.fav=true;if(!m.date)m.date=TODAY}});log.push(`${f.name}: ${k} (${kind})`)}
save();render();toast('Importado → '+log.join(' · ')+(tk()?'. Usa «Completar pósteres y datos».':''))}
function expCSV(k){const ms=k=='watchlist'?S.movies.filter(m=>!m.seen):k=='likes'?S.movies.filter(m=>m.fav):k=='ratings'?seen().filter(m=>m.rating):seen();
const H={watched:['Date','Name','Year','Letterboxd URI'],ratings:['Date','Name','Year','Letterboxd URI','Rating'],diary:['Date','Name','Year','Letterboxd URI','Rating','Rewatch','Tags','Watched Date'],watchlist:['Date','Name','Year','Letterboxd URI'],likes:['Date','Name','Year','Letterboxd URI']}[k];
const row=m=>{const b=[m.date||TODAY,m.title,m.year,''];return k=='ratings'?[...b,m.rating]:k=='diary'?[...b,m.rating||'',m.rw0?'Yes':'','',m.date||'']:b};
dl(k+'.csv',toCSV(H,k=='diary'?ms.flatMap(m=>[row(m),...(m.rw||[]).map(r=>[r.date,m.title,m.year,'',r.rating||'','Yes','',r.date])]):ms.map(row)),'text/csv');toast(`${k}.csv exportado (${ms.length})`)}
async function impJ(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.movies))throw 0;d.movies=d.movies.filter(m=>m&&m.title).map(m=>({...m,id:m.id||++nid,genres:Array.isArray(m.genres)?m.genres:[],cast:Array.isArray(m.cast)?m.cast:[],year:m.year||'',dur:m.dur||0,dir:m.dir||''}));if(!d.tmdb&&S.tmdb)d.tmdb=S.tmdb;S=d;applyTheme();save();render();toast('Copia restaurada')}catch(e){toast('JSON no válido')}}

const ppl=(l,f)=>{const o={};l.forEach(m=>f(m).forEach(k=>{if(!k)return;const e=o[k]||(o[k]={name:k,n:0,rs:0,rn:0});e.n++;if(m.rating>0){e.rs+=m.rating;e.rn++}}));return Object.values(o).sort((a,b)=>b.n-a.n||(b.rn?b.rs/b.rn:0)-(a.rn?a.rs/a.rn:0)).slice(0,5).map(e=>({name:e.name,n:e.n,avg:e.rn?e.rs/e.rn:0}))};
function wrExtra(l,mo,n){const wdc=Array(7).fill(0),hb=Array(n).fill(0),lens=Array(5).fill(0),dm={};let rw=0;
l.forEach(m=>{wdc[(new Date(m.date+'T12:00').getDay()+6)%7]++;const i=mo?+m.date.slice(8,10)-1:+m.date.slice(5,7)-1;if(i>=0&&i<n)hb[i]+=(m.dur||0)/60;if(m.dur>0)lens[durB(m.dur)]++;if(m.year){const dc=Math.floor(m.year/10)*10;dm[dc]=(dm[dc]||0)+1}if(isRw(m))rw++});
let decs=Object.entries(dm).map(([k,v])=>[+k,v]);if(decs.length>8)decs=decs.sort((a,b)=>b[1]-a[1]).slice(0,8);decs.sort((a,b)=>a[0]-b[0]);
const ga={};l.forEach(m=>{if(m.rating>0)(m.genres||[]).forEach(g=>{const e=ga[g]||(ga[g]={s:0,n:0});e.s+=m.rating;e.n++})});
let gl=Object.entries(ga).map(([k,e])=>({name:k,avg:e.s/e.n,n:e.n}));const g2=gl.filter(x=>x.n>=2);if(g2.length>=3)gl=g2;gl=gl.sort((a,b)=>b.avg-a.avg||b.n-a.n).slice(0,6).map(x=>[x.name,Math.round(x.avg*100)/100]);
const yc=ST.y?views().filter(m=>m.date&&m.date.startsWith(String(ST.y))).length:0;
return{wdc,hb:hb.map(v=>Math.round(v*10)/10),lens,decs:decs.map(([k,v])=>[k+'s',v]),gAvg:gl,firstN:l.length-rw,goal:ST.y&&S.goal?S.goal:0,goalCount:yc,goalYear:ST.y||0,dirs:ppl(l,m=>(m.dir||'').split(', ').filter(x=>x!=='Desconocido')),actors:ppl(l,m=>m.cast||[])}}
function wrStats(l,mo){const DN=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],n=mo?new Date(ST.y,ST.m+1,0).getDate():12,bk=Array(n).fill(0),rt=Array(10).fill(0);let mins=0,rw=0,rs=0,rn=0;
l.forEach(m=>{mins+=m.dur||0;if(isRw(m))rw++;const i=mo?+m.date.slice(8,10)-1:+m.date.slice(5,7)-1;if(i>=0&&i<n)bk[i]++;if(m.rating>0){const j=Math.round(m.rating*2)-1;if(j>=0&&j<10)rt[j]++;rs+=m.rating;rn++}});
const ds=[...new Set(l.map(m=>m.date))].sort(),t=d=>Date.parse(d+'T12:00:00Z')/864e5;let st=0,cu=0;ds.forEach((d,i)=>{cu=i&&t(d)-t(ds[i-1])==1?cu+1:1;if(cu>st)st=cu});
const top=a=>a[0]?{name:a[0][0],n:a[0][1]}:null,wd=cnt(l,m=>[DN[new Date(m.date+'T12:00').getDay()]]),bs=[...l].filter(m=>m.rating>0).sort((a,b)=>b.rating-a.rating)[0],lg=[...l].filter(m=>m.dur>0).sort((a,b)=>b.dur-a.dur)[0],dd=l.filter(m=>m.dur>0);
return{...wrExtra(l,mo,n),minutes:mins,count:l.length,avg:rn?rs/rn:0,rewatches:rw,streak:st,wd:wd[0]?wd[0][0]:'',avgDur:dd.length?Math.round(dd.reduce((s,m)=>s+m.dur,0)/dd.length):0,topDir:top(cnt(l,m=>(m.dir||'').split(', '))),topActor:top(cnt(l,m=>m.cast||[])),best:bs?{title:bs.title,rating:bs.rating}:null,longest:lg?{title:lg.title,dur:lg.dur}:null,genres:cnt(l,m=>m.genres).slice(0,6),buckets:bk,ratings:rt}}
function wrPool(){const o=[],k=new Set();S.movies.filter(m=>m.seen).forEach(m=>{const key=(m.title||'').toLowerCase()+'|'+m.year;if(k.has(key))return;k.add(key);const p=m.poster||'';o.push({title:m.title,year:m.year,dir:(m.dir||'').split(', ')[0],rating:m.rating||0,poster:(/^https?:/.test(p)||(p.startsWith('data:')&&p.length<150000))?p:'',date:m.date||''})});return o}
function wrSend(){const f=$('#wrf'),mo=!!(ST.y&&ST.m>=0),l=stFilt(stPer(),mo).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title)),per=ST.y?(mo?MN[ST.m]+' ':'')+ST.y:'Todos los años',fl=ST.f?wrUn(fLabel(mo)):'';
const d={mode:mo?'month':'year',month:mo?ST.m:-1,year:ST.y?ST.y:'TOTAL',sub:fl||(mo?'Pelis del mes':ST.y?'Pelis del año':'Todas mis pelis'),title:'',allTitles:false,films:l.map(m=>({title:m.title,year:m.year,dir:(m.dir||'').split(', ')[0],rating:m.rating||0,poster:m.poster||'',rewatch:isRw(m),date:m.date}))};
d.stats=l.length?wrStats(l,mo):null;d.pool=wrPool();$('#wrT').textContent='🎬 Wrapped · '+per+(fl?' · '+fl:'');$('#wrN').textContent=l.length+(l.length==1?' película':' películas');
const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
try{f.contentWindow.WR.theme({bg:g('--bg'),panel:g('--card'),line:g('--line'),fg:g('--tx'),muted:g('--mu'),accent:g('--gold'),ink:g('--on'),light:document.documentElement.classList.contains('light')})}catch(e){}
const sig=JSON.stringify(d);if(sig===wrSig)return;try{f.contentWindow.WR.load(d);wrSig=sig;wrPhotoReq(d.stats)}catch(e){}}
const PH=(()=>{try{return JSON.parse(localStorage.getItem('cv_pph')||'{}')}catch(e){return{}}})(),PHT=new Set();
function wrPhSend(map){try{$('#wrf').contentWindow.WR.photos(map)}catch(e){}}
async function wrPhotoReq(st){if(!st)return;const want=[];(st.dirs||[]).forEach(p=>want.push(['d|'+p.name,p.name,'Directing']));(st.actors||[]).forEach(p=>want.push(['a|'+p.name,p.name,'Acting']));
const have=()=>{const o={};want.forEach(w=>{if(PH[w[0]]!==undefined)o[w[0]]=PH[w[0]]});return o};wrPhSend(have());
const need=want.filter(w=>PH[w[0]]===undefined&&!PHT.has(w[0]));if(!need.length||!tk())return;
await Promise.all(need.map(async w=>{PHT.add(w[0]);try{const r=((await tm('/search/person',{query:w[1]})).results||[]).filter(x=>x.profile_path),p=r.find(x=>x.known_for_department==w[2])||r[0];PH[w[0]]=p?'https://image.tmdb.org/t/p/w342'+p.profile_path:''}catch(e){}}));
try{localStorage.setItem('cv_pph',JSON.stringify(PH))}catch(e){}wrPhSend(have())}
function wrOpen(){$('#wr').classList.add('on');const f=$('#wrf');if(f.dataset.ready)wrSend();else{f.onload=()=>{f.dataset.ready='1';wrSend()};f.srcdoc=WR_SRC}}
function wrClose(){$('#wr').classList.remove('on')}

</script></body></html>
